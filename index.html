<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>하루 할 일</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="할 일">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F3F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101217" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone planner. Calendar header (big date + month/week) on top, task list below, bottom tab bar + add button. */
:root{
  --bg:#F2F3F6; --surface:#FFFFFF; --ink:#171B24; --muted:#687087; --line:#E2E5EC; --soft:#ECEEF3;
  --accent:#E5484D; --accent-ink:#FFFFFF; --ok:#2F9E68;
  --c-work:#3E63DD; --c-life:#2F9E68; --c-home:#D9820B; --c-etc:#8E4EC6;
  --p0:#0E7C86; --p1:#C2410C; --p2:#6D28D9; --p3:#B91C6B;
  --heat1:#FBD9DA; --heat2:#F5A3A6; --heat3:#E5484D;
  --anniv:#D6409F; --anniv-soft:#FBE4F1;
  --f-num:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body:"IBM Plex Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --r:14px;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#101217; --surface:#191C23; --ink:#ECEEF2; --muted:#8C93A4; --line:#2A2E38; --soft:#22262F;
  --accent:#FF6369; --accent-ink:#1A0B0C; --ok:#4CC38A;
  --c-work:#7B93F0; --c-life:#4CC38A; --c-home:#F2A33A; --c-etc:#B58AE0;
  --p0:#3CC4CF; --p1:#FB923C; --p2:#A78BFA; --p3:#F472B6;
  --heat1:#4A2226; --heat2:#8A3338; --heat3:#FF6369; --anniv:#F07CC4; --anniv-soft:#3A1F31; color-scheme:dark}}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-block:18px 150px;display:flex;flex-direction:column;gap:18px}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.date-big{display:flex;align-items:flex-end;gap:12px}
.date-num{font-family:var(--f-num);font-weight:800;font-size:76px;line-height:.82;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.date-num.red{color:var(--accent)}
.date-meta{display:flex;flex-direction:column;padding-bottom:2px}
.date-month{font-size:13px;color:var(--muted);letter-spacing:.04em}
.date-dow{font-size:19px;font-weight:600;line-height:1.25}
.date-rel{font-size:13px;color:var(--muted)}
.date-hol{font-size:12px;color:var(--accent);font-weight:500}
.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.top-btns{display:flex;gap:6px;align-items:center}
.pill-btn{font-size:13px;font-weight:500;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{font-size:13px;font-weight:500;padding:4px 12px;border-radius:999px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* people */
.people{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.avs{display:flex}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff;background:var(--pc,var(--muted));border:2px solid var(--bg);margin-left:-6px}
.av:first-child{margin-left:0}
.av.lg{width:34px;height:34px;font-size:14px;margin:0;border:0}
.who{display:inline-flex;align-items:center;gap:4px}
.who i{width:7px;height:7px;border-radius:50%;background:var(--pc,var(--muted));display:inline-block}
.live{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.live.on{background:var(--ok)}

/* week strip */
.week{background:var(--surface);border-radius:var(--r);padding:10px 6px 12px;display:grid;grid-template-columns:28px repeat(7,1fr) 28px;align-items:center}
.wk-nav{height:44px;min-width:28px;display:grid;place-items:center;color:var(--muted);font-size:18px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;border-radius:12px}
.day .dw{font-size:11px;color:var(--muted)}
.day .dn{font-family:var(--f-num);font-weight:700;font-size:22px;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.day.sun .dw,.day.sun .dn,.day.hol .dn,.day.hol .dw{color:var(--accent)}
.day.today .dn{box-shadow:inset 0 0 0 2px var(--accent)}
.day.sel .dn{background:var(--ink);color:var(--bg)}
.day.today.sel .dn{background:var(--accent);color:var(--accent-ink);box-shadow:none}

/* month grid */
.month{background:var(--surface);border-radius:var(--r);padding:8px 8px 10px;display:flex;flex-direction:column;gap:4px}
.m-head{display:flex;align-items:center;justify-content:space-between}
.m-head span{font-weight:600;font-size:15px}
.m-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.m-grid .hd{font-size:11px;color:var(--muted);text-align:center;padding:2px 0 4px}
.m-grid .hd.sun{color:var(--accent)}
@property --rh{syntax:'<length>';inherits:true;initial-value:46px}
@property --p{syntax:'<number>';inherits:true;initial-value:0}
#app{--rh:46px;--p:0;transition:--rh .42s cubic-bezier(.2,.9,.25,1),--p .42s cubic-bezier(.2,.9,.25,1)}
#app.dragging{transition:none}
.m-grid{row-gap:0}
.mday{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 1px 2px;height:var(--rh);overflow:hidden;min-width:0;
  border-top:1px solid color-mix(in srgb, var(--line) calc(var(--p) * 100%), transparent);
  background:transparent;border-radius:calc((1 - var(--p)) * 10px)}
.mday .dn{flex:none;font-family:var(--f-num);font-weight:700;font-size:18px;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.mday.sun .dn,.mday.hol .dn{color:var(--accent)}
.mday.sat .dn{color:color-mix(in srgb, var(--c-work) calc(var(--p) * 100%), var(--ink))}
.mday.out{opacity:.35}
.mday.today .dn{box-shadow:inset 0 0 0 2px var(--accent)}
.mday.sel .dn{background:var(--ink);color:var(--bg)}
.mday.today.sel .dn{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.mday.sel{background:color-mix(in srgb, var(--soft) calc(var(--p) * 100%), transparent)}
.mday .dots{opacity:calc(1 - var(--p) * 2.2)}
.bitems{display:flex;flex-direction:column;gap:2px;min-width:0;align-self:stretch;opacity:calc(var(--p) * 1.6 - .4);transform:translateY(calc((1 - var(--p)) * -6px))}
.bi{display:block;font-size:10.5px;line-height:1.35;padding:1px 3px;border-radius:3px;white-space:nowrap;overflow:hidden;text-align:left;
  background:color-mix(in srgb, var(--cc, var(--muted)) 16%, transparent);border-left:2px solid var(--cc, var(--muted));color:var(--ink)}
.bi.dn-t{text-decoration:line-through;color:var(--muted);opacity:.75}
.bi.hl{background:color-mix(in srgb, var(--accent) 12%, transparent);border-left:0;color:var(--accent);font-weight:500}
.bi.ev{background:var(--anniv-soft);border-left:2px solid var(--anniv);font-weight:500}
.bi.ev.ms{background:transparent;border:1px dashed var(--anniv);border-left-width:1px}
.bmore{font-size:10px;color:var(--muted);text-align:center}
.month{transition:margin .42s cubic-bezier(.2,.9,.25,1),padding .42s cubic-bezier(.2,.9,.25,1)}
.is-big .month{margin-inline:-10px;padding-inline:2px}
.grip{display:grid;place-items:center;height:22px;width:100%;margin-top:2px;touch-action:none}
.grip span{width:36px;height:4px;border-radius:2px;background:var(--line);transition:width .3s}
.is-big .grip span{width:24px}
.below{display:flex;flex-direction:column;gap:18px;opacity:calc(1 - var(--p) * 1.4);transform:translateY(calc(var(--p) * 24px))}
.is-big .below{pointer-events:none}
.is-big:not(.dragging) .below{visibility:hidden;max-height:0;overflow:hidden;transition:visibility 0s .42s,max-height 0s .42s}
.dots{display:flex;gap:2px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--muted);opacity:.55}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:flex;gap:6px;align-items:center;white-space:nowrap}
.chip .sw{width:8px;height:8px;border-radius:50%}
.chip .ct{color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .ct{color:inherit;opacity:.7}

/* progress */
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:4px;border-radius:2px;background:var(--soft);overflow:hidden}
.bar b{display:block;height:100%;background:var(--ok);border-radius:2px;transition:width .3s}

/* sections & tasks */
.sec{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em;padding:0 2px}
.sec-h.warn{color:var(--accent)}
.sec-h button{font-weight:500;font-size:13px}
.list{background:var(--surface);border-radius:var(--r);overflow:hidden}
.task{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--cc,var(--muted));display:grid;place-items:center;margin-top:1px}
.chk svg{width:13px;height:13px;opacity:0}
.task.done .chk{background:var(--cc,var(--muted))}
.task.done .chk svg{opacity:1}
.t-body{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:2px}
.t-title{overflow-wrap:anywhere}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.t-meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.t-meta .late{color:var(--accent);font-weight:500}
.t-act{flex:none;font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--soft);margin-top:1px}

.empty{background:var(--surface);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty strong{color:var(--ink);font-weight:600;font-size:16px}
.empty p{margin:0;font-size:14px;max-width:32ch}

/* log */
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.heat-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.heat-top .big{font-family:var(--f-num);font-weight:800;font-size:40px;line-height:1}
.heat-top span{font-size:13px;color:var(--muted)}
.by-person{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}
.by-person b{font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat .hd{font-size:10px;color:var(--muted);text-align:center}
.hc{aspect-ratio:1;max-width:100%;border-radius:7px;background:var(--soft);display:grid;place-items:center;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.hc.l1{background:var(--heat1)} .hc.l2{background:var(--heat2);color:var(--ink)} .hc.l3{background:var(--heat3);color:var(--accent-ink)}
.hc.fut{background:transparent;border:1px dashed var(--line)}
.hc.tdy{box-shadow:inset 0 0 0 2px var(--ink)}

/* tab bar + fab */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink);font-weight:600}
.fab{position:fixed;z-index:21;right:max(18px, calc(env(safe-area-inset-right, 0px) + 18px));bottom:calc(76px + env(safe-area-inset-bottom, 0px));
  width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(229,72,77,.35)}
.fab svg{width:26px;height:26px}
@media (min-width:600px){.fab{right:calc(50% - 260px + 4px)}}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,12,18,.45)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:20px 20px 0 0;max-height:92%;overflow:auto;
  padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.sheet-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 4px}
.sheet h2{margin:0;font-size:17px}
.field{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--soft);border:1px solid transparent;border-radius:12px;padding:12px 14px}
textarea.field{font-size:15px;min-height:72px;resize:vertical}
.lbl{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em;margin-bottom:-6px}
.date-in{font:inherit;font-size:13px;color:inherit;background:transparent;border:0;padding:2px 4px;min-height:26px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;padding:13px;border-radius:12px;font-weight:600;background:var(--soft);text-align:center}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.danger{color:var(--accent)}
.btn.danger.armed{background:var(--accent);color:var(--accent-ink)}
.hint{font-size:12px;color:var(--muted);margin:-4px 0 0}
.mrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .mi{flex:1;min-width:0;display:flex;flex-direction:column}
.mrow .mi span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.mrow .tag{font-size:11px;color:var(--muted);background:var(--soft);padding:2px 8px;border-radius:999px}
.inline{display:flex;gap:8px}
.inline .field{flex:1;min-width:0;font-size:15px;padding:10px 12px}
.inline .btn{flex:none;padding:10px 16px}
.msg{font-size:13px;margin:0}
.msg.err{color:var(--accent)}
.msg.ok{color:var(--ok)}

/* auth */
.auth{max-width:400px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:22px;padding-block:32px}
.brand{display:flex;flex-direction:column;gap:6px}
.brand .num{font-family:var(--f-num);font-weight:800;font-size:96px;line-height:.8;color:var(--accent)}
.brand h1{margin:0;font-size:26px}
.brand p{margin:0;color:var(--muted);font-size:14px}
.auth form{display:flex;flex-direction:column;gap:10px}
.auth .switch{font-size:14px;color:var(--muted);text-align:center}
.auth .switch button{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* calendar picker */
.cal-tag{font-size:10px;font-weight:600;letter-spacing:.04em;padding:1px 6px;border-radius:999px;background:var(--soft);color:var(--muted)}
.chev{width:12px;height:12px}
.callist{display:flex;flex-direction:column;gap:6px}
.calrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);text-align:left}
.calrow .mi{flex:1;min-width:0;display:flex;flex-direction:column}
.calrow .mi span{font-size:12px;color:var(--muted)}
.calrow .radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.calrow.on{border-color:var(--ink)}
.calrow.on .radio{border:5px solid var(--ink)}
.calrow .tag{font-size:11px;color:var(--muted);background:var(--soft);padding:2px 8px;border-radius:999px}
.divider{height:1px;background:var(--line);margin:4px 0}
.av.ghost{background:var(--soft);color:var(--muted)}
.t-act.danger-on{background:var(--accent);color:var(--accent-ink)}

/* header follows the pull */
.people{white-space:nowrap;min-width:0;max-width:100%}
.people > span:not(.avs):not(.live):not(.cal-tag){overflow:hidden;text-overflow:ellipsis;max-width:9em}
.top-right{min-width:0}
.date-month{white-space:nowrap}
.date-num{font-size:calc(76px - var(--p) * 34px)}
.date-dow{font-size:calc(19px - var(--p) * 3px)}
.date-rel,.date-hol{opacity:calc(1 - var(--p));max-height:calc((1 - var(--p)) * 20px);overflow:hidden}
.mday .dots{height:calc((1 - var(--p)) * 5px);overflow:hidden}
.mday .dn{width:calc(30px - var(--p) * 6px);height:calc(30px - var(--p) * 6px);font-size:calc(18px - var(--p) * 3px)}

/* anniversaries */
.evm{width:5px;height:5px;border-radius:50%;background:var(--anniv);display:inline-block}
.evlist{display:flex;flex-direction:column;gap:6px}
.ev{display:flex;align-items:center;gap:10px;background:var(--anniv-soft);border-radius:12px;padding:10px 14px;text-align:left}
.ev .ev-k{font-size:11px;font-weight:600;color:var(--anniv);letter-spacing:.03em;flex:none}
.ev .ev-t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.ev.ms{background:var(--surface);border:1px dashed var(--anniv)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dcard{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:2px;text-align:left;border-top:3px solid var(--anniv);min-width:0}
.dc-t{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.dc-n{font-family:var(--f-num);font-weight:800;font-size:34px;line-height:1.05;color:var(--anniv);font-variant-numeric:tabular-nums}
.dc-s{font-size:12px;color:var(--muted)}
.dpill{flex:none;align-self:center;font-size:12px;font-weight:600;color:var(--anniv);background:var(--anniv-soft);padding:3px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.dpill.soft{background:transparent;border:1px solid var(--anniv-soft)}
.task.up{width:100%;text-align:left;align-items:center}
.up-d{flex:none;width:64px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tick{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:4px;border:1.5px solid currentColor;font-size:10px;line-height:1}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom, 0px));z-index:60;background:var(--ink);color:var(--bg);font-size:14px;padding:9px 16px;border-radius:999px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.toast button{font-weight:600;color:var(--accent)}
.boot{min-height:60vh;display:grid;place-items:center;color:var(--muted)}

@media (prefers-reduced-motion:no-preference){

  @keyframes pop{50%{transform:scale(1.18)}}
}
